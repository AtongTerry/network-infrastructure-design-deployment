<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#212529">Network Infrastructure Design &amp; Deployment Lab: Logical Topology (BR01)</text>

  <!-- Links (drawn first so boxes sit on top) -->
  <g stroke="#495057" stroke-width="2" fill="none">
    <line x1="500" y1="94" x2="500" y2="120"/>
    <line x1="500" y1="170" x2="500" y2="220"/>
    <line x1="430" y1="280" x2="260" y2="360" stroke-width="4"/>
    <line x1="570" y1="280" x2="740" y2="360" stroke-width="4"/>
    <line x1="260" y1="420" x2="105" y2="490"/>
    <line x1="260" y1="420" x2="255" y2="490"/>
    <line x1="260" y1="420" x2="405" y2="490"/>
    <line x1="740" y1="420" x2="685" y2="490"/>
    <line x1="740" y1="420" x2="840" y2="490"/>
  </g>
  <g stroke="#495057" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <line x1="405" y1="540" x2="350" y2="600"/>
    <line x1="405" y1="540" x2="460" y2="600"/>
  </g>

  <!-- Internet -->
  <ellipse cx="500" cy="72" rx="70" ry="22" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <text x="500" y="77" text-anchor="middle" font-size="13" fill="#212529">Internet / WAN</text>

  <!-- Firewall -->
  <rect x="400" y="120" width="200" height="50" rx="6" fill="#f8d7da" stroke="#842029" stroke-width="2"/>
  <text x="500" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">BR01-FW-01</text>
  <text x="500" y="158" text-anchor="middle" font-size="11" fill="#212529">Firewall / router</text>
  <text x="512" y="200" font-size="11" fill="#212529">Transit 10.50.0.0/30 (FW .1 / Core .2)</text>

  <!-- Core -->
  <rect x="340" y="220" width="320" height="60" rx="6" fill="#cff4fc" stroke="#055160" stroke-width="2"/>
  <text x="500" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">BR01-CORE-01</text>
  <text x="500" y="258" text-anchor="middle" font-size="11" fill="#212529">L3 switch, gateway SVIs for VLANs 10/20/30/40/50/99</text>
  <text x="500" y="272" text-anchor="middle" font-size="11" fill="#212529">DHCP, inter-VLAN routing, default route to firewall</text>

  <!-- Port-channel labels -->
  <text x="270" y="305" text-anchor="middle" font-size="11" fill="#212529">Po1 (LACP trunk)</text>
  <text x="270" y="319" text-anchor="middle" font-size="11" fill="#212529">Core Fa0/1-2 to ACC-01 Fa0/21-22</text>
  <text x="745" y="305" text-anchor="middle" font-size="11" fill="#212529">Po2 (LACP trunk)</text>
  <text x="745" y="319" text-anchor="middle" font-size="11" fill="#212529">Core Fa0/3-4 to ACC-02 Fa0/21-22</text>

  <!-- Access switches -->
  <rect x="150" y="360" width="220" height="60" rx="6" fill="#cff4fc" stroke="#055160" stroke-width="2"/>
  <text x="260" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">BR01-ACC-01</text>
  <text x="260" y="402" text-anchor="middle" font-size="11" fill="#212529">Access switch, Mgmt 10.50.99.11</text>

  <rect x="630" y="360" width="220" height="60" rx="6" fill="#cff4fc" stroke="#055160" stroke-width="2"/>
  <text x="740" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">BR01-ACC-02</text>
  <text x="740" y="402" text-anchor="middle" font-size="11" fill="#212529">Access switch, Mgmt 10.50.99.12</text>

  <!-- Endpoints on ACC-01 -->
  <rect x="40" y="490" width="130" height="50" rx="6" fill="#cfe2ff" stroke="#0a58ca" stroke-width="2"/>
  <text x="105" y="511" text-anchor="middle" font-size="12" font-weight="bold" fill="#212529">Workstations</text>
  <text x="105" y="527" text-anchor="middle" font-size="11" fill="#212529">VLAN 10 USERS</text>

  <rect x="190" y="490" width="130" height="50" rx="6" fill="#d1e7dd" stroke="#146c43" stroke-width="2"/>
  <text x="255" y="511" text-anchor="middle" font-size="12" font-weight="bold" fill="#212529">IP phones</text>
  <text x="255" y="527" text-anchor="middle" font-size="11" fill="#212529">VLAN 20 VOICE</text>

  <rect x="340" y="490" width="130" height="50" rx="6" fill="#e2e3e5" stroke="#41464b" stroke-width="2"/>
  <text x="405" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#212529">BR01-AP-01</text>
  <text x="405" y="522" text-anchor="middle" font-size="10" fill="#212529">Mgmt VLAN 99, trunk</text>
  <text x="405" y="534" text-anchor="middle" font-size="10" fill="#212529">ACC-01 Fa0/19</text>

  <!-- Wireless clients -->
  <rect x="300" y="600" width="100" height="44" rx="6" fill="#cfe2ff" stroke="#0a58ca" stroke-width="2"/>
  <text x="350" y="618" text-anchor="middle" font-size="11" font-weight="bold" fill="#212529">BR01-Staff</text>
  <text x="350" y="633" text-anchor="middle" font-size="10" fill="#212529">SSID to VLAN 10</text>

  <rect x="410" y="600" width="100" height="44" rx="6" fill="#fff3cd" stroke="#997404" stroke-width="2"/>
  <text x="460" y="618" text-anchor="middle" font-size="11" font-weight="bold" fill="#212529">BR01-Guest</text>
  <text x="460" y="633" text-anchor="middle" font-size="10" fill="#212529">SSID to VLAN 50</text>

  <!-- Endpoints on ACC-02 -->
  <rect x="620" y="490" width="130" height="50" rx="6" fill="#e2d9f3" stroke="#59359a" stroke-width="2"/>
  <text x="685" y="511" text-anchor="middle" font-size="12" font-weight="bold" fill="#212529">Printers / IoT</text>
  <text x="685" y="527" text-anchor="middle" font-size="11" fill="#212529">VLAN 40 PRINTERS</text>

  <rect x="775" y="490" width="130" height="50" rx="6" fill="#ffe5d0" stroke="#a5490b" stroke-width="2"/>
  <text x="840" y="511" text-anchor="middle" font-size="12" font-weight="bold" fill="#212529">Local server</text>
  <text x="840" y="527" text-anchor="middle" font-size="11" fill="#212529">VLAN 30 SERVERS</text>

  <!-- Legend -->
  <rect x="610" y="565" width="380" height="100" rx="6" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/>
  <text x="635" y="583" font-size="12" font-weight="bold" fill="#212529">VLAN plan (10.50.x.0)</text>
  <rect x="635" y="592" width="12" height="12" fill="#cfe2ff" stroke="#0a58ca"/>
  <text x="654" y="602" font-size="11" fill="#212529">10 USERS  10.50.10.0/24</text>
  <rect x="635" y="612" width="12" height="12" fill="#d1e7dd" stroke="#146c43"/>
  <text x="654" y="622" font-size="11" fill="#212529">20 VOICE  10.50.20.0/24</text>
  <rect x="635" y="632" width="12" height="12" fill="#ffe5d0" stroke="#a5490b"/>
  <text x="654" y="642" font-size="11" fill="#212529">30 SERVERS  10.50.30.0/26</text>
  <rect x="805" y="592" width="12" height="12" fill="#e2d9f3" stroke="#59359a"/>
  <text x="824" y="602" font-size="11" fill="#212529">40 PRINTERS  10.50.40.0/26</text>
  <rect x="805" y="612" width="12" height="12" fill="#fff3cd" stroke="#997404"/>
  <text x="824" y="622" font-size="11" fill="#212529">50 GUEST  10.50.50.0/24</text>
  <rect x="805" y="632" width="12" height="12" fill="#e2e3e5" stroke="#41464b"/>
  <text x="824" y="642" font-size="11" fill="#212529">99 MGMT  10.50.99.0/26</text>
  <text x="635" y="658" font-size="10" fill="#495057">Native VLAN 999 on all trunks. Solid = wired, dashed = wireless.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
